// Firefox skips this file's first line. The standby display's prefs (the kiosk's, spec R13.2) and its fallback page.
lockPref("apz.allow_zooming", false);
lockPref("browser.gesture.pinch.in", "");
lockPref("browser.gesture.pinch.out", "");
lockPref("browser.gesture.swipe.left", "");
lockPref("browser.gesture.swipe.right", "");
lockPref("widget.disable-swipe-tracker", true);
lockPref("browser.sessionstore.resume_from_crash", false);

// While the status app doesn't answer, show the same page from disk, never Firefox's error page; fallback.html returns
// to the live page by itself once the status app answers.
Services.obs.addObserver(win => {
  win.setInterval(() => {
    const browser = win.gBrowser.selectedBrowser;
    if (browser.documentURI?.spec.startsWith("about:neterror")) {
      browser.fixupAndLoadURIString("file:///opt/timeclock-standby/fallback.html", {
        triggeringPrincipal: Services.scriptSecurityManager.getSystemPrincipal(),
      });
    }
  }, 1000);
}, "browser-delayed-startup-finished");
