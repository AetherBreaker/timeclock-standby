# sway on the clock (timeclock-display.service): one screen, two windows (timeclock-system's standby-screen spec §3).
# The standby (cog on the status page) is tiled alone; the clock (cog on the clock app) waits hidden in the scratchpad
# until the watcher shows it, fullscreen over the standby. No key bindings: nothing at the clock rearranges or closes a
# window. Ctrl+Alt+F<n> still reaches the consoles (sway handles it).
xwayland disable
default_border none
default_floating_border none
focus_follows_mouse no
# No error bar on the clock's screen, whatever goes wrong; sway's errors go to the journal.
swaynag_command -
# The cursor hides after 3 s still; the app also hides it on the clock (`?kiosk`).
seat * hide_cursor 3000
# The number pad types digits whatever Num Lock says, on every keyboard, replugged ones included (as the kiosk had).
input type:keyboard xkb_options numpad:mac
# RustDesk's virtual keyboard can't switch terminals: a remote Ctrl+Alt+F<n> would take the screen from sway and freeze
# the remote picture.
input "4660:22136:RustDesk_UInput_Keyboard" xkb_options numpad:mac,srvrkeys:none
# Every window but the standby goes to the scratchpad as it appears, before its first frame: the clock's until the
# watcher shows it, anything unexpected for good. Only the standby is ever tiled.
for_window [app_id="^(?!local\.timeclock\.Standby$)"] move scratchpad
# The splash's logo, centred as on the splash, until the standby page draws.
output * bg /usr/share/plymouth/themes/timeclock/watermark.png center #000000
# Hands sway's socket to root's user services: the screen sharing RustDesk uses.
include /etc/sway/config.d/*
