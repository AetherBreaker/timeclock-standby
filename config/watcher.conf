# /etc/timeclock/watcher.conf: the screen watcher's settings. Every key is optional; the values below are the
# defaults. A change takes effect with `systemctl restart timeclock-watcher`.

# When the standby screen takes over during a deploy: app-stopped (when the clock stops being live) or deploy-start
# (as soon as Coolify's helper container appears).
#flip = app-stopped

#clock_vt = 1
#standby_vt = 7
# After Ctrl+Alt+F<n>, hands off until this long with no keyboard or touch input.
#idle_return_secs = 120
# After any other switch (a display checking in, chvt over SSH), wait this long before switching again.
#settle_secs = 5
# The clock must be down this long before the standby shows.
#standby_delay_secs = 3
# How recent Ctrl+Alt+F<n> must be to count as a person's switch.
#user_key_window_ms = 500
#browser_process = firefox-esr
#app_port = 8080
#helper_image = coollabsio/coolify-helper
#docker_socket = /var/run/docker.sock
