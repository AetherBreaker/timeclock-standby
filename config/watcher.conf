# /etc/timeclock/watcher.conf: the screen watcher's settings. Every key is optional; the values below are the
# defaults. A change takes effect with `systemctl restart timeclock-watcher`.

# When the standby takes over during a deploy: app-stopped (when the clock stops being live) or deploy-start (as soon
# as Coolify's helper container appears).
#flip = app-stopped

# sway's terminal, its control socket, the clock window's app id, and the clock browser's unit (its connection to the
# app's port is what makes the clock live).
#display_vt = 7
#sway_socket = /run/timeclock-display/sway.sock
#clock_app_id = local.timeclock.Clock
#clock_unit = timeclock-clock.service
#app_port = 8080
# After Ctrl+Alt+F<n> to a console, hands off until this long with no keyboard or touch input.
#idle_return_secs = 120
# After anyone else's switch to a console (chvt over SSH), wait this long before switching back.
#settle_secs = 5
# The clock must be down this long before the standby shows.
#standby_delay_secs = 3
# How recent Ctrl+Alt+F<n> must be to count as a person's switch.
#user_key_window_ms = 500
#helper_image = coollabsio/coolify-helper
#docker_socket = /var/run/docker.sock

# The host updater (bootc hosts): the host image (a channel is a tag on it), the app's compose service (its container's
# HOST_UPDATE_CHANNEL, HOST_UPDATE_MODE and HOST_UPDATE_WINDOW choose the channel and when to update), how often it
# looks, how long nobody must have touched the screen before it restarts the clock, and how long a new host has to come
# up before it rolls back.
#host_image = ghcr.io/aetherbreaker/timeclock-host
#app_service = timeclock-system
#update_check_secs = 60
#update_idle_secs = 60
#update_health_secs = 600
