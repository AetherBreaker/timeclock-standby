# Installed as /etc/systemd/system/sweetfiresupportdesk.service.d/10-timeclock.conf. RustDesk picks the screen's session
# once, at start: started before sway's login session exists, it settles on X11 and remote sessions can't reach the
# screen (main-office, 2026-10-30). So it starts once sway answers (up to a minute, then anyway), and restarts with the
# display. Its screen process also needs the session's environment, which a system service doesn't have: sway's
# Wayland socket and the session bus, for the screen-sharing portal (the kiosk's remote.sh exported the same).
[Unit]
After=timeclock-display.service
PartOf=timeclock-display.service

[Service]
Environment=XDG_RUNTIME_DIR=/run/user/0 XDG_SESSION_TYPE=wayland XDG_CURRENT_DESKTOP=sway
Environment=DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/0/bus
ExecStartPre=-/bin/sh -c 'i=0; until swaymsg -s /run/timeclock-display/sway.sock -t get_version >/dev/null 2>&1 || [ "$i" -ge 120 ]; do sleep 0.5; i=$((i + 1)); done'
ExecStart=
ExecStart=/bin/sh -c 'for s in /run/user/0/wayland-*; do [ -S "$s" ] && export WAYLAND_DISPLAY="$${s##*/}"; done; exec /usr/bin/sweetfiresupportdesk --service'
