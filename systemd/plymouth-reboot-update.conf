# Installed as /usr/lib/systemd/system/plymouth-reboot.service.d/10-timeclock-update.conf. When the watcher restarts
# the clock for a host update it leaves /run/timeclock-host-updating behind first, and the reboot splash says so (the
# theme's [updates] mode); any other reboot shows the plain splash.
[Service]
ExecStartPost=-/bin/sh -c '[ ! -e /run/timeclock-host-updating ] || /usr/bin/plymouth change-mode --updates'
