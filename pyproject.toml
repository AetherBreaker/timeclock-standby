[project]
name = "timeclock-standby"
version = "0.2.1"
description = "Standby screen and screen watcher for the timeclock kiosk"
# The status app runs on Debian 13's own Python 3.13, standard library only; pytest is for its tests.
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["status/tests"]
pythonpath = ["status"]

[tool.ruff]
target-version = "py313"
indent-width = 2
line-length = 135

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
extend-select = ["A", "ANN001", "B", "C4", "C90", "D", "DTZ", "FBT003", "LOG", "N", "PERF", "PL", "RUF", "T10", "TC", "UP"]
# EXE002: a Windows checkout marks every file executable.
ignore = ["A004", "EXE002", "PLC0415", "PLR0913", "PLW0603"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# A test's name is its summary.
"**/tests/**" = ["D1"]
