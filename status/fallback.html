<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Time clock</title>
  <link rel="stylesheet" href="standby.css">
</head>
<body>
  <!-- cog's start page, from disk: shown until the status app answers, so cog never shows an error page. -->
  <main>
    <h1>Starting up</h1>
    <ol><li class="active">Starting up</li></ol>
  </main>
  <script>
    // On to the live page as soon as the status app answers (no-cors: any answer at all means it's up).
    const live = "http://127.0.0.1:8091/";
    const check = () => fetch(live, { mode: "no-cors", cache: "no-store" }).then(() => location.replace(live), () => {});
    check();
    setInterval(check, 2000);
  </script>
</body>
</html>
